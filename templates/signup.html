<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up · Velocity Chatbot</title>
<style>
    :root {
        --bg: #0f1117;
        --card: #171a23;
        --border: #2a2e3a;
        --accent: #6c5ce7;
        --accent-hover: #5a4bd6;
        --text: #e8e8ef;
        --text-dim: #9a9db0;
        --error: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
    }
    .card {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 32px;
        margin: 16px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.sub { color: var(--text-dim); font-size: 0.9rem; margin: 0 0 24px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-dim); }
    input {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 16px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0f1117;
        color: var(--text);
        font-size: 0.95rem;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
        width: 100%;
        padding: 11px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    .error {
        background: rgba(255,107,107,0.1);
        border: 1px solid var(--error);
        color: var(--error);
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 0.85rem;
        margin-bottom: 16px;
    }
    .switch { text-align: center; margin-top: 18px; font-size: 0.85rem; color: var(--text-dim); }
    .switch a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .switch a:hover { text-decoration: underline; }
</style>
</head>
<body>
    <div class="card">
        <h1>🤖 Create your account</h1>
        <p class="sub">Sign up to start chatting with Velocity</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/signup">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" value="{{ name or '' }}">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required value="{{ email or '' }}">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6">

            <label for="confirm_password">Confirm password</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="6">

            <button type="submit">Sign up</button>
        </form>

        <div class="switch">
            Already have an account? <a href="/login">Log in</a>
        </div>
    </div>
</body>
</html>
